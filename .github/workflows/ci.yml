name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & test (Qt ${{ matrix.qt }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Floor 6.8 + rolling latest only (for-all-times Phase 3: the
        # 17-version matrix is overbuilt for a one-consumer library).
        qt: ["6.8.2", "6.10.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            dbus dbus-x11 libdbus-1-dev \
            libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev

      - name: Install Qt ${{ matrix.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Oracle target built (C5)
        # The wire-oracle pins QSKIP when the binary is absent — a missing
        # oracle must fail the job, not silently shrink the evidence.
        run: |
          cmake --build build --target oracle
          test -x build/oracle

      - name: "Run C++ tests (all four targets — E0: run-tests used to skip test_adaptor/test_introspect)"
        run: ctest --test-dir build --output-on-failure

      - name: Run QML tests
        env:
          QML_IMPORT_PATH: ${{ github.workspace }}/build
          QT_QPA_PLATFORM: offscreen
        run: |
          # install-qt-action exports QT_ROOT_DIR pointing at the Qt install
          # root; qmltestrunner lives under $QT_ROOT_DIR/bin.
          QMLTESTRUNNER=$(find "$QT_ROOT_DIR" -name qmltestrunner -type f | head -n1)
          test -n "$QMLTESTRUNNER" || { echo "qmltestrunner not found under $QT_ROOT_DIR"; exit 1; }
          dbus-run-session -- "$QMLTESTRUNNER" -input tests/test_api.qml

      - name: qmllint (examples + tests)
        run: |
          QT_BIN=$(find "$QT_ROOT_DIR" -name qmllint -type f | head -n1)
          test -n "$QT_BIN" || { echo "qmllint not found"; exit 1; }
          "$QT_BIN" $(find . -name '*.qml' -not -path './build*/*')

      - name: Examples compile (qmlimportscan smoke)
        run: |
          QMLIMPORTSCAN=$(find "$QT_ROOT_DIR" -name qmlimportscanner -type f | head -n1)
          test -n "$QMLIMPORTSCAN" || { echo "qmlimportscan not found"; exit 1; }
          for f in $(find examples -name '*.qml'); do
            QML_IMPORT_PATH=${{ github.workspace }}/build "$QMLIMPORTSCAN" -importPath examples -importPath build "$f" > /dev/null || exit 1
          done

  sanitizers:
    name: Sanitizers (ASan+LSan, TSan — the T1-class catcher)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["address,undefined", "thread"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang \
            dbus dbus-x11 libdbus-1-dev \
            libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev

      - name: Install Qt 6.8.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          cache: true

      - name: Configure with sanitizer
        run: |
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"

      - name: Build
        run: cmake --build build-san

      - name: Oracle target built (C5)
        run: |
          cmake --build build-san --target oracle
          test -x build-san/oracle

      - name: Run C++ tests under sanitizer
        env:
          QT_QPA_PLATFORM: offscreen
          # Ledger-zero L2/L3: checked-in suppressions for Qt-internal
          # exit-time (LSan) and race (TSan) noise; see
          # tests/lsan-suppressions.txt and tests/tsan-suppressions.txt.
          # TSan gate = the targeted selection (full-suite ctest wedges
          # TSan's thread registry under churn — L3 wedge triage,
          # docs/PARITY.md §9; per-test processes).
          #
          # F-amended (tsan-classifier-gate, supersedes road-to-one C3's
          # grep-gate): the detector records everything; the VERDICT comes
          # from scripts/tsan-classify.py over the captured logs —
          # OURS-attribution blocks (access/allocation stacks) FAIL;
          # register-matched foreign blocks are counted, censused,
          # non-failing; unregistered foreign FAILs (the knob). TSan's
          # exitcode=0 stays: the classifier, not the detector's process
          # exit, owns the verdict. The canary battery (pure + mixed +
          # foreign) runs first through the real classifier — a canary
          # that stops firing fails the job itself. The independent
          # crosscheck (scripts/tsan-crosscheck.sh) re-greps the
          # classifier's foreign blocks and must agree.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan-suppressions.txt:fast_unwind_on_malloc=0
          # fast_unwind_on_malloc=0: LSan's default fast unwinder stops at
          # the first frame without frame pointers (Qt's archive builds),
          # producing 2-frame nameless stacks that mis-attribute leaks and
          # make named suppressions unmatchable; the slow (DWARF) unwinder is
          # what xdg-desktop-portal's CI uses (its tests/conftest.py). An
          # unwinder setting, not a suppression.
          TSAN_OPTIONS: exitcode=0:suppressions=${{ github.workspace }}/tests/tsan-suppressions.txt
        run: |
          if [ "${{ matrix.sanitizer }}" = "thread" ]; then
            # One command, identical to the fork-side evidence flow
            # (fixture self-tests → canary battery → the C1-validated
            # 12-test selection → classifier + crosscheck + census).
            ./scripts/tsan-gate --build build-san --runs 1
          else
            ctest --test-dir build-san --output-on-failure
          fi

  fuzzers:
    name: Fuzz remote-facing parsers (short CI run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang \
            dbus dbus-x11

      - name: Install Qt 6.8.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          cache: true

      - name: Build fuzz targets (seed-corpus smoke mains)
        run: |
          cmake -S fuzzers -B build-fuzz -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-fuzz

      - name: Run fuzzers over seed corpus (must terminate, must pass)
        run: |
          ./build-fuzz/fuzz_introspection_xml ./fuzzers/corpus/introspection/
          ./build-fuzz/fuzz_signature ./fuzzers/corpus/signatures/

      # NOTE: the libFuzzer long-run variant (clang + -fsanitize=fuzzer,
      # -max_total_time=60 per target) is a manual/occasional job, not a
      # per-PR gate — GCC (the matrix compiler) has no -fsanitize=fuzzer.
      # Same for the dfuzzer live-service job against the gate backend
      # (plan: ~/Documents/dbusqml/plans/for-all-times/gate/).
